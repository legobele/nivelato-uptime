<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nivelato status</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: #0b0b0e; color: #f2f1ec; margin: 0; padding: 0 0 48px; }
  .banner { display: flex; align-items: center; gap: 12px; color: #fff;
            font-size: 20px; font-weight: 600; padding: 18px 24px; }
  .banner.up { background: #1a7f37; }
  .banner.down { background: #cf222e; }
  .banner svg { flex-shrink: 0; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 28px 20px 0; }
  h1 { font-size: 32px; font-weight: 600; margin: 0 0 6px; }
  h1 .dot { color: #f5a524; }
  .sub { color: #a7a7b3; font-size: 15px; margin-bottom: 24px; }
  .sub a { color: #f5a524; text-decoration: none; }
  .card { background: #16161c; border: 1px solid #232329; border-radius: 12px;
          margin-bottom: 16px; position: relative; }
  .card-head { display: flex; align-items: center; justify-content: space-between;
               padding: 16px 20px 4px; }
  .card-title { font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .q { width: 22px; height: 22px; border: 1px solid #2c2c31; border-radius: 50%;
       color: #f5a524; font-size: 13px; display: inline-flex; align-items: center;
       justify-content: center; cursor: help; background: #16161c; }
  .check { width: 34px; height: 34px; border-radius: 50%; background: #1a7f37;
           display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .check.bad { background: #cf222e; }
  .bars { display: flex; gap: 2px; align-items: flex-end; height: 40px;
          padding: 12px 20px 0; }
  .bar { flex: 1; min-width: 1px; height: 34px; border-radius: 2px; cursor: pointer; }
  .bar.up { background: #2d6a35; }
  .bar.part { background: #9a7b2d; }
  .bar.down { background: #e5534b; }
  .bar.none { background: #232329; cursor: default; }
  .labels { display: flex; align-items: center; padding: 8px 20px 0;
            color: #a7a7b3; font-size: 14px; }
  .labels .rule { flex: 1; height: 1px; background: #2c2c31; margin: 0 16px; }
  .state { padding: 6px 20px 18px; color: #a7a7b3; font-size: 14px; }
  .tip { position: absolute; z-index: 10; background: #1c1c22; border: 1px solid #2c2c31;
         border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.5);
         padding: 18px 20px; min-width: 280px; max-width: 92%; display: none; }
  .tip.show { display: block; }
  .tip .x { position: absolute; top: 10px; right: 14px; color: #a7a7b3;
            cursor: pointer; font-size: 18px; }
  .tip h3 { margin: 0 0 12px; font-size: 17px; font-weight: 600; }
  .tip .inc { background: #232329; border-radius: 6px; padding: 12px 16px;
              display: flex; justify-content: space-between; font-size: 16px; margin-bottom: 14px; }
  .tip .rel { color: #a7a7b3; font-size: 12px; letter-spacing: .08em; margin-bottom: 6px; }
  .tip .relt { font-size: 15px; }
  .inc-row { background: #16161c; border: 1px solid #232329; border-radius: 12px;
             padding: 14px 20px; margin-bottom: 10px; display: flex;
             align-items: center; gap: 12px; }
  .inc-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .inc-dot.open { background: #cf222e; }
  .inc-dot.closed { background: #59636e; }
  .inc-body { flex: 1; }
  .inc-name { font-weight: 600; font-size: 15px; }
  .inc-meta { color: #a7a7b3; font-size: 13px; margin-top: 2px; }
  .inc-badge { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 20px;
               flex-shrink: 0; }
  .inc-badge.open { background: #3d1f1f; color: #ff7b72; }
  .inc-badge.closed { background: #232329; color: #a7a7b3; }
  .inc-empty { color: #a7a7b3; font-size: 14px; padding: 8px 0 16px; }
  h2 { font-size: 20px; font-weight: 600; margin: 28px 0 12px; }
  /* Report form */
  .report-form { background: #16161c; border: 1px solid #232329; border-radius: 12px;
                 padding: 20px; margin-bottom: 16px; }
  .report-form label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
  .report-form label:first-child { margin-top: 0; }
  .report-form select, .report-form textarea, .report-form input {
    width: 100%; background: #0b0b0e; border: 1px solid #2c2c31; border-radius: 8px;
    color: #f2f1ec; font-size: 15px; padding: 10px 12px; font-family: inherit; }
  .report-form textarea { min-height: 90px; resize: vertical; }
  .report-form select:focus, .report-form textarea:focus, .report-form input:focus {
    outline: none; border-color: #f5a524; }
  .btn { display: inline-block; background: #f5a524; color: #0b0b0e; border: none;
         border-radius: 8px; padding: 12px 24px; font-size: 15px; font-weight: 700;
         cursor: pointer; margin-top: 16px; font-family: inherit; }
  .btn:disabled { opacity: .5; cursor: default; }
  .form-msg { margin-top: 12px; font-size: 14px; display: none; }
  .form-msg.ok { display: block; color: #7ee787; }
  .form-msg.err { display: block; color: #ff7b72; }
  .rep-row { background: #16161c; border: 1px solid #232329; border-radius: 12px;
             padding: 14px 20px; margin-bottom: 10px; }
  .rep-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .rep-site { font-weight: 700; font-size: 14px; background: #232329; padding: 3px 10px;
              border-radius: 20px; }
  .rep-time { color: #a7a7b3; font-size: 13px; }
  .rep-body { margin-top: 8px; font-size: 14px; color: #d6d6dc; line-height: 1.5; }
  footer { text-align: center; color: #a7a7b3; font-size: 13px; margin-top: 32px; }
  footer a { color: #f5a524; text-decoration: none; }
</style>
</head>
<body>
<div class="banner up" id="banner">
  <svg id="banner-icon" width="26" height="26" viewBox="0 0 16 16" fill="#fff"><path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.75.75 0 0 1 1.06-1.06L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"/></svg>
  <span id="banner-text">All Systems Operational</span>
</div>
<div class="wrap">
  <h1>Nivelato<span class="dot">.</span> status</h1>
  <div class="sub">Uptime over the past 90 days, probed every 15 minutes. Unofficial monitor.</div>
  <div id="cards"></div>

  <h2>Recent incidents</h2>
  <div id="incidents"></div>

  <h2>Report an outage</h2>
  <div class="report-form">
    <p style="color:#a7a7b3;font-size:14px;margin:0 0 4px">Seeing something broken? Tell us. Reports are public but anonymous.</p>
    <form id="report-form" onsubmit="return false">
      <label for="rep-site">Which site is down?</label>
      <select id="rep-site">
        <option value="login">Login (login.nivelatolabs.com)</option>
        <option value="app">App (app.nivelatolabs.com)</option>
        <option value="pages">Hosting (Cloudflare Pages)</option>
        <option value="other">Something else</option>
      </select>
      <label for="rep-what">What were you doing when it broke?</label>
      <textarea id="rep-what" maxlength="500" placeholder="e.g. Tried to sign in, got stuck on a loading screen"></textarea>
      <label for="rep-contact">Contact (optional, only if you want a reply)</label>
      <input id="rep-contact" type="text" maxlength="120" placeholder="email or handle" autocomplete="off">
      <button class="btn" id="rep-submit" type="submit">Send report</button>
      <div class="form-msg" id="rep-msg"></div>
    </form>
  </div>

  <h2>User reports</h2>
  <div id="user-reports"><div class="inc-empty">Loading reports...</div></div>

  <footer>unofficial monitor · data: <a href="status.json">status.json</a></footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: "<redacted>",
  authDomain: "nivelato-app.firebaseapp.com",
  projectId: "nivelato-app",
  storageBucket: "nivelato-app.firebasestorage.app",
  messagingSenderId: "759893408531",
  appId: "1:759893408531:web:696e2da5f004a3bac5f8e6"
};
let db = null;
try {
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
} catch (e) { console.warn("reports unavailable:", e); }

const SITE_NAMES = {
  login: "Login", app: "App", pages: "Hosting", other: "Other"
};
const esc = s => String(s || "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const fmtDate = d => {
  const [y, m, dd] = d.split('-').map(Number);
  return new Date(y, m - 1, dd).toLocaleDateString('en-GB', {day: 'numeric', month: 'short', year: 'numeric'});
};
const pct = v => v === null || v === undefined ? '–' : (Number.isInteger(v) ? v + ' %' : v.toFixed(2) + ' %');
const timeAgo = iso => {
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + " min ago";
  if (s < 86400) return Math.floor(s / 3600) + " hr ago";
  return Math.floor(s / 86400) + " d ago";
};

async function load() {
  const s = await (await fetch('status.json?' + Date.now())).json();
  const allUp = Object.values(s.targets || {}).every(t => t.status === 'up');
  const banner = document.getElementById('banner');
  banner.className = 'banner ' + (allUp ? 'up' : 'down');
  document.getElementById('banner-text').textContent =
    allUp ? 'All Systems Operational' : 'Some Systems Down';
  document.getElementById('banner-icon').innerHTML = allUp
    ? '<path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.75.75 0 0 1 1.06-1.06L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"/>'
    : '<path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.749.749 0 0 1 1.275.326.749.749 0 0 1-.215.734L9.06 8l3.22 3.22a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215L8 9.06l-3.22 3.22a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"/>';

  const host = document.getElementById('cards');
  host.innerHTML = '';
  for (const [key, t] of Object.entries(s.targets || {})) {
    const days = (s.daily && s.daily[key]) || [];
    const card = document.createElement('div');
    card.className = 'card';
    const bars = days.map(d => {
      const cls = d.uptime === null ? 'none' : d.uptime >= 99.5 ? 'up' : d.uptime <= 0 ? 'down' : 'part';
      return `<div class="bar ${cls}" data-d="${d.d}" data-u="${d.uptime === null ? '' : d.uptime}" data-m="${d.down_min || 0}"></div>`;
    }).join('');
    const iconPath = t.status === 'up'
      ? 'M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.75.75 0 0 1 1.06-1.06L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z'
      : 'M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.749.749 0 0 1 1.275.326.749.749 0 0 1-.215.734L9.06 8l3.22 3.22a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215L8 9.06l-3.22 3.22a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z';
    card.innerHTML = `
      <div class="card-head">
        <div class="card-title">${esc(t.name)}
          <span class="q" title="${esc(t.url)}">?</span></div>
        <div class="check ${t.status === 'up' ? '' : 'bad'}">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="#fff"><path d="${iconPath}"/></svg>
        </div>
      </div>
      <div class="bars">${bars}</div>
      <div class="labels"><span>90 days ago</span><span class="rule"></span>
        <span>${pct(t.uptime_90d)} uptime</span><span class="rule"></span><span>Today</span></div>
      <div class="state">${t.status === 'up' ? 'Normal' : 'Down'} · last check HTTP ${t.http_code} · ${t.response_ms} ms</div>
      <div class="tip"><span class="x">✕</span><h3></h3><div class="inc"></div>
        <div class="rel">RELATED</div><div class="relt"></div></div>`;
    host.appendChild(card);

    const tip = card.querySelector('.tip');
    const showTip = (bar) => {
      const d = bar.dataset.d, u = bar.dataset.u, m = +bar.dataset.m;
      tip.querySelector('h3').textContent = fmtDate(d);
      if (u === '' || u === undefined) {
        tip.querySelector('.inc').innerHTML = '<span>No data</span><span></span>';
        tip.querySelector('.relt').textContent = 'No data for this day yet.';
      } else if (+u >= 99.5) {
        tip.querySelector('.inc').innerHTML = '<span>No downtime</span><span></span>';
        tip.querySelector('.relt').textContent = 'No downtime recorded on this day.';
      } else {
        const h = Math.floor(m / 60), mm = m % 60;
        tip.querySelector('.inc').innerHTML =
          `<span>Incident</span><span>${h > 0 ? h + ' hrs ' : ''}${mm} mins</span>`;
        tip.querySelector('.relt').textContent = 'Outage detected by the automated monitor.';
      }
      const r = bar.getBoundingClientRect(), cr = card.getBoundingClientRect();
      tip.style.left = Math.max(8, Math.min(cr.width - 300, r.left - cr.left + r.width / 2 - 150)) + 'px';
      tip.classList.add('show');
      const above = r.top - cr.top - tip.offsetHeight - 12;
      tip.style.top = (above < 0 ? (r.bottom - cr.top + 12) : above) + 'px';
    };
    card.querySelectorAll('.bar').forEach(b =>
      b.addEventListener('click', e => { e.stopPropagation(); showTip(b); }));
    tip.querySelector('.x').addEventListener('click', e => { e.stopPropagation(); tip.classList.remove('show'); });

    const q = card.querySelector('.q');
    q.addEventListener('click', e => {
      e.stopPropagation();
      const checks = {
        login: 'Expects HTTP 200 and the page to mention Nivelato.',
        app: 'Expects HTTP 200 and the page to mention Nivelato.',
        pages: 'Expects HTTP 200 from the Cloudflare Pages deployment.'
      };
      tip.querySelector('h3').textContent = t.name;
      tip.querySelector('.rel').textContent = 'HOW IT IS CHECKED';
      tip.querySelector('.inc').innerHTML =
        `<span style="word-break:break-all"><a href="${esc(t.url)}" target="_blank" rel="noopener" style="color:#f5a524;text-decoration:none">${esc(t.url)}</a></span><span></span>`;
      tip.querySelector('.relt').textContent =
        (checks[key] || 'HTTP check.') + ' Probed every 15 minutes.';
      const qr = q.getBoundingClientRect(), cr = card.getBoundingClientRect();
      tip.style.left = Math.max(8, Math.min(cr.width - 300, qr.left - cr.left - 140)) + 'px';
      tip.style.top = (qr.bottom - cr.top + 10) + 'px';
      tip.classList.add('show');
    });
  }
  document.addEventListener('click', () =>
    document.querySelectorAll('.tip.show').forEach(t => t.classList.remove('show')));

  const incHost = document.getElementById('incidents');
  const incidents = s.incidents || [];
  if (!incidents.length) {
    incHost.innerHTML = '<div class="inc-empty">No incidents recorded in the last 90 days.</div>';
  } else {
    incHost.innerHTML = incidents.map(i => {
      const open = !i.ended_at;
      const dur = open ? 'ongoing' :
        (i.duration_min >= 60
          ? Math.floor(i.duration_min / 60) + 'h ' + (i.duration_min % 60) + 'm'
          : i.duration_min + ' min');
      return `<div class="inc-row">
        <div class="inc-dot ${open ? 'open' : 'closed'}"></div>
        <div class="inc-body">
          <div class="inc-name">${esc(i.target_name)}</div>
          <div class="inc-meta">${fmtDate(i.started_at.slice(0, 10))} · ${dur} · ${i.down_checks} failed check${i.down_checks === 1 ? '' : 's'}</div>
        </div>
        <div class="inc-badge ${open ? 'open' : 'closed'}">${open ? 'ONGOING' : 'RESOLVED'}</div>
      </div>`;
    }).join('');
  }
}

// Report form
document.getElementById('report-form').addEventListener('submit', async () => {
  const msg = document.getElementById('rep-msg');
  const btn = document.getElementById('rep-submit');
  const site = document.getElementById('rep-site').value;
  const what = document.getElementById('rep-what').value.trim();
  const contact = document.getElementById('rep-contact').value.trim();
  msg.className = 'form-msg';
  if (!what) { msg.classList.add('err'); msg.textContent = 'Tell us what broke first.'; return; }
  if (!db) { msg.classList.add('err'); msg.textContent = 'Reports are unavailable right now. Try again later.'; return; }
  btn.disabled = true;
  try {
    await db.collection('uptime_reports').add({
      site, what: what.slice(0, 500), contact: contact.slice(0, 120) || null,
      created_at: firebase.firestore.FieldValue.serverTimestamp(),
      status: 'open'
    });
    msg.classList.add('ok'); msg.textContent = 'Report sent. Thanks for the heads up.';
    document.getElementById('rep-what').value = '';
    document.getElementById('rep-contact').value = '';
    loadReports();
  } catch (e) {
    msg.classList.add('err'); msg.textContent = 'Could not send the report. Try again later.';
  }
  btn.disabled = false;
});

// Recent user reports (anonymized, newest first, cap 20)
async function loadReports() {
  const host = document.getElementById('user-reports');
  if (!db) { host.innerHTML = '<div class="inc-empty">Reports are unavailable right now.</div>'; return; }
  try {
    const snap = await db.collection('uptime_reports')
      .orderBy('created_at', 'desc').limit(20).get();
    if (snap.empty) {
      host.innerHTML = '<div class="inc-empty">No user reports yet.</div>';
      return;
    }
    host.innerHTML = snap.docs.map(d => {
      const r = d.data();
      const when = r.created_at && r.created_at.toDate
        ? timeAgo(r.created_at.toDate().toISOString()) : '';
      return `<div class="rep-row">
        <div class="rep-top">
          <span class="rep-site">${esc(SITE_NAMES[r.site] || r.site)}</span>
          <span class="rep-time">${esc(when)}</span>
        </div>
        <div class="rep-body">${esc(r.what)}</div>
      </div>`;
    }).join('');
  } catch (e) {
    host.innerHTML = '<div class="inc-empty">Could not load reports.</div>';
  }
}

load();
loadReports();
setInterval(load, 60000);
setInterval(loadReports, 120000);
</script>
</body>
</html>
